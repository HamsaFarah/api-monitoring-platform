spring.application.name=api-monitoring-platform
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/api_monitoring}
spring.datasource.username=${DB_USERNAME:hamsafarah}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

monitoring.scheduler-delay-ms=${MONITORING_SCHEDULER_DELAY_MS:5000}
monitoring.scheduler-enabled=${MONITORING_SCHEDULER_ENABLED:true}
